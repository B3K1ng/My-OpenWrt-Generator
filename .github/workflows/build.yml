name: Build Custom Patched OpenWrt for Linksys Mesh

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    name: Build OpenWrt (${{ matrix.friendly_name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: qualcommax
            subtarget: ipq807x
            profile: linksys_mx4200v1
            friendly_name: MX4200v1
          - target: qualcommax
            subtarget: ipq50xx
            profile: linksys_mx2000
            friendly_name: MX2000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget time

      - name: Clone Specific OpenWrt Stable Release Tag
        run: |
          git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt-src

      - name: Update and Install Feeds
        run: |
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download and Inject ath11k Buffer Patch
        run: |
          cd openwrt-src
          mkdir -p package/kernel/mac80211/patches/ath11k
          wget -O package/kernel/mac80211/patches/ath11k/950-ath11k-shrink-rx-buffer-rings.patch \
            https://githubusercontent.com

      - name: Configure Custom App Manifest
        run: |
          cd openwrt-src
          # 1. Select the hardware target profiles
          echo "CONFIG_TARGET_${{ matrix.target }}=y" > .config
          echo "CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y" >> .config
          echo "CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}_DEVICE_${{ matrix.profile }}=y" >> .config
          
          # 2. Add LuCI Web Interface components
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          
          # 3. Strip default wireless packages to prevent conflicts
          echo "CONFIG_PACKAGE_wpad-basic-wolfssl=n" >> .config
          echo "CONFIG_PACKAGE_wpad-basic=n" >> .config
          echo "CONFIG_PACKAGE_wpad-openssl=n" >> .config
          
          # 4. Inject Optimized OpenSSL-backed WPAD Mesh
          echo "CONFIG_PACKAGE_wpad-mesh-openssl=y" >> .config
          
          # 5. Core Batman-adv routing layer tools
          echo "CONFIG_PACKAGE_kmod-batman-adv=y" >> .config
          echo "CONFIG_PACKAGE_batctl=y" >> .config
          
          # Expand remaining standard settings
          make defconfig

      - name: Compile Firmware
        run: |
          cd openwrt-src
          make -j2 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p out/
          find openwrt-src/bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/ -type f -name "*sysupgrade.bin" -exec cp {} out/ \;
          cd out/
          mv *sysupgrade.bin OpenWrt-25.12.5-custom-${{ matrix.friendly_name }}-sysupgrade.bin || true

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Stable-Firmware-${{ matrix.friendly_name }}
          path: out/*.bin
